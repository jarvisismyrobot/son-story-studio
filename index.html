<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事工作室</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="故事工作室">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif; background: #141422; color: #eee; min-height: 100vh; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #1a1a2e; display: flex; flex-direction: column; }

  header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 20px 20px 14px; }
  header h1 { font-size: 22px; color: #ffd369; letter-spacing: 2px; }
  header p { font-size: 12px; color: #a0a0b8; margin-top: 4px; }

  nav.tabs { display: flex; background: #0f0f1e; position: sticky; top: 0; z-index: 10; }
  nav.tabs button { flex: 1; background: none; border: none; padding: 14px 4px; font-size: 14px; color: #8888a0; cursor: pointer; border-bottom: 3px solid transparent; font-family: inherit; }
  nav.tabs button.active { color: #ffd369; border-bottom-color: #ffd369; font-weight: bold; }

  main { flex: 1; padding: 16px; padding-bottom: 40px; }
  .page { display: none; }
  .page.active { display: block; }

  /* Library */
  .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .story-card { background: #252542; border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .15s; }
  .story-card:active { transform: scale(.97); }
  .story-cover { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .story-card .info { padding: 10px 12px 12px; }
  .story-card .title { font-size: 15px; font-weight: bold; color: #fff; }
  .story-card .meta { font-size: 11px; color: #8888a0; margin-top: 4px; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .card-btn { flex: 1; background: #1a1a2e; border: 1px solid #3a3a5c; color: #aaa; border-radius: 8px; padding: 9px 4px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .card-btn:active { border-color: #ffd369; color: #ffd369; }
  .card-btn.danger { color: #e94560; border-color: #e9456044; }
  .card-btn.icon-only { flex: 0 0 50px; font-size: 16px; }
  .card-btn.danger:active { border-color: #e94560; color: #e94560; }
  .card-btn.pressing {
    background: linear-gradient(90deg, rgba(233,69,96,.35) var(--p,0%), rgba(233,69,96,.08) var(--p,0%));
    border-color: #e94560; color: #e94560;
    -webkit-touch-callout: none; user-select: none; touch-action: none;
  }
  .big-btn { margin-top: 16px; width: 100%; padding: 16px; background: linear-gradient(135deg, #e94560, #c73e5a); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; }
  .backup-row { display: flex; gap: 10px; margin-top: 12px; }
  .backup-btn { flex: 1; background: #252542; border: 1px solid #3a3a5c; color: #aaa; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .backup-btn:active { border-color: #ffd369; color: #ffd369; }
  .backup-note { font-size: 11px; color: #555; text-align: center; margin-top: 8px; line-height: 1.8; }
  .empty { text-align: center; padding: 60px 20px; color: #666; font-size: 14px; line-height: 2; }

  /* Write */
  .back-btn { background: none; border: none; color: #ffd369; font-size: 14px; cursor: pointer; padding: 4px 0 12px; font-family: inherit; }
  .story-title-input { width: 100%; background: transparent; border: none; color: #ffd369; font-size: 20px; font-weight: bold; padding: 4px 0 12px; font-family: inherit; outline: none; }
  .chap-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
  .chap-chip { flex-shrink: 0; background: #252542; color: #ccc; border: none; border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chap-chip.active { background: #ffd369; color: #1a1a2e; font-weight: bold; }
  .chap-chip.add { border: 1px dashed #555; background: transparent; color: #888; }
  .write-area { width: 100%; background: #252542; border: none; border-radius: 12px; padding: 16px; min-height: 300px; font-size: 15px; line-height: 2; color: #ddd; font-family: inherit; resize: vertical; outline: none; }
  .write-area:focus { outline: 2px solid #ffd36955; }
  .chap-title-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .chap-title-row input { flex: 1; background: #252542; border: none; border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 14px; font-family: inherit; outline: none; }
  .icon-btn { background: #252542; border: none; border-radius: 10px; color: #888; padding: 10px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .icon-btn:active { color: #e94560; }
  .save-hint { font-size: 11px; color: #555; text-align: right; margin-top: 6px; }

  /* Spark button */
  .spark-wrap { margin-top: 14px; text-align: center; }
  .spark-btn { background: none; border: 1px dashed #555; color: #8888a0; border-radius: 20px; padding: 8px 18px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .spark-btn:active { border-color: #ffd369; color: #ffd369; }
  .spark-results { margin-top: 10px; display: none; }
  .spark-results.show { display: block; }
  .spark-item { background: #252542; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 13px; color: #ddd; line-height: 1.7; text-align: left; }
  .spark-note { font-size: 11px; color: #555; margin-top: 8px; }

  /* Characters */
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .char-card { background: #252542; border-radius: 14px; padding: 16px 12px; text-align: center; position: relative; }
  .char-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .char-card .name { font-size: 15px; font-weight: bold; color: #fff; }
  .char-card .desc { font-size: 12px; color: #8888a0; margin-top: 6px; line-height: 1.6; }
  .char-card .x { position: absolute; top: 6px; right: 10px; color: #555; font-size: 16px; cursor: pointer; }
  .char-form { background: #252542; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .char-form input, .char-form textarea { width: 100%; background: #1a1a2e; border: 1px solid #3a3a5c; border-radius: 8px; padding: 10px 12px; color: #eee; font-size: 14px; font-family: inherit; margin-bottom: 10px; outline: none; }
  .char-form textarea { min-height: 60px; resize: vertical; }
  .char-form button { width: 100%; padding: 12px; background: #ffd369; color: #1a1a2e; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
  .photo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .photo-preview { width: 56px; height: 56px; border-radius: 50%; background: #1a1a2e; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #666; overflow: hidden; flex-shrink: 0; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-btn { background: #1a1a2e; border: 1px solid #3a3a5c; color: #aaa; border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .char-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  .story-picker { margin-bottom: 14px; }
  .story-picker select { width: 100%; background: #252542; color: #ffd369; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: bold; font-family: inherit; outline: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>故事工作室</h1>
    <p>意念係你嘅，AI 淨係隻手 · v1.21</p>
  </header>
  <nav class="tabs">
    <button class="active" data-tab="library">故事架</button>
    <button data-tab="write">寫故事</button>
    <button data-tab="chars">人物卡</button>
  </nav>
  <main>
    <section class="page active" id="page-library"></section>
    <section class="page" id="page-write"></section>
    <section class="page" id="page-chars"></section>
  </main>
</div>

<script>
// ============ Data ============
const KEY = 'storyStudioV1';
let state = load() || { stories: [], activeStory: null, activeChapter: null };
let activeTab = 'library';

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch(e) { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) {
    const full = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    if (full && Date.now() - quotaWarned > 60000) {
      quotaWarned = Date.now();
      alert('儲存空間爆咗！去故事架撳「備份」下載咗先，再刪啲唔要嘅相或者封面。');
    }
    return false;
  }
}
let quotaWarned = 0;
function storageMB() {
  try { return ((localStorage.getItem(KEY) || '').length / 1048576).toFixed(1); }
  catch (e) { return '?'; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const COVERS = [
  'linear-gradient(135deg,#0f3460,#16537e)',
  'linear-gradient(135deg,#1b2a4a,#2e5a88)',
  'linear-gradient(135deg,#3a1c4a,#6a2c7a)',
  'linear-gradient(135deg,#4a2c1a,#8a5a2e)',
  'linear-gradient(135deg,#1a4a2e,#2e8a5a)',
  'linear-gradient(135deg,#4a1a2e,#8a2e5a)'
];
const COVER_EMOJI = ['🐉','🌊','🚀','🏰','🌲','⚔️','🐯','🤖','👻','🌙','⭐','🔥','🌈','🏝️','🐙','🦄','🐺','🍄','⚡️','🌪️','❄️','🌋','👑','💎'];
// 封面選擇器
const coverPickerCSS = `
.cover-picker-ov { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.cover-picker { background: #252542; border-radius: 16px; padding: 18px; max-width: 340px; width: 100%; }
.cover-upload { display: block; width: 100%; font-size: 13px; color: #ffd369; border: 1px dashed #ffd36966; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: none; cursor: pointer; font-family: inherit; }
.cover-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.cover-grid button { background: none; border: none; font-size: 28px; cursor: pointer; border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
.cover-grid button:active { background: #ffd36933; }
.story-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }`;
function storyCover(s, i) { return (s && s.cover) || COVER_EMOJI[i % 6]; }
function pickCover(id) {
  closeCoverPicker();
  const st = document.createElement('style'); st.id = 'coverPickerCSS'; st.textContent = coverPickerCSS;
  document.head.appendChild(st);
  const ov = document.createElement('div');
  ov.id = 'coverPicker'; ov.className = 'cover-picker-ov';
  ov.innerHTML = '<div class="cover-picker">'
    + `<button class="cover-upload" onclick="document.getElementById('coverFile').click()">📤 上載圖片做封面</button>`
    + '<div class="cover-grid">' + COVER_EMOJI.map(e => `<button onclick="setCover('${id}','${e}')">${e}</button>`).join('') + '</div>'
    + '</div>'
    + `<input type="file" id="coverFile" accept="image/*" style="display:none" onchange="uploadCover('${id}',this)">`;
  ov.onclick = e => { if (e.target === ov) closeCoverPicker(); };
  document.body.appendChild(ov);
}
function closeCoverPicker() {
  const ov = document.getElementById('coverPicker'); if (ov) ov.remove();
  const st = document.getElementById('coverPickerCSS'); if (st) st.remove();
}
function setCover(id, emoji) {
  const s = state.stories.find(x => x.id === id);
  if (s) { s.cover = emoji; s.updatedAt = Date.now(); save(); }
  closeCoverPicker(); renderLibrary();
}
function uploadCover(id, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // 壓縮到 480px，封面夠清又慳 localStorage 位
      const max = 480;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      setCover(id, cv.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function coverHTML(s, i) {
  const c = storyCover(s, i);
  return c.startsWith('data:') ? `<img src="${c}" alt="">` : esc(c);
}
const AVATAR_BG = [
  'linear-gradient(135deg,#e94560,#ff7b54)',
  'linear-gradient(135deg,#0f3460,#16537e)',
  'linear-gradient(135deg,#533483,#7b2ff7)',
  'linear-gradient(135deg,#1a4a2e,#2e8a5a)',
  'linear-gradient(135deg,#4a2c1a,#8a5a2e)',
  'linear-gradient(135deg,#3a3a5c,#6a6a8c)'
];
const AVATAR_EMOJI = ['🦎','🧙','👦','🤖','🐱','👾'];

function getStory() { return state.stories.find(s => s.id === state.activeStory); }
function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
function fmtDate(ts) { const d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate(); }

// ============ 朗讀 ============
let reading = false;
function guessLang(text) {
  const t = text || '';
  const en = t.replace(/[^A-Za-z]/g, '').length;
  const zh = t.replace(/[^一-鿿]/g, '').length;
  return en > zh * 2 ? 'en' : 'zh';
}
function stopRead() {
  reading = false;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  const b = document.getElementById('readBtn');
  if (b) b.textContent = '🔊 朗讀';
}
function toggleRead() {
  if (!('speechSynthesis' in window)) { alert('呢部機唔支援朗讀'); return; }
  if (reading) { stopRead(); return; }
  const s = getStory();
  const ch = s ? (s.chapters.find(c => c.id === state.activeChapter) || s.chapters[0]) : null;
  const text = ((ch && ch.title ? ch.title + '。' : '') + (ch && ch.content ? ch.content : '')).trim();
  if (!text) { alert('寫咗嘢先讀到喎'); return; }
  const lang = guessLang(text);
  const u = new SpeechSynthesisUtterance(text);
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => x.lang && x.lang.toLowerCase().startsWith(lang === 'en' ? 'en' : 'zh')) || null;
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = lang === 'en' ? 'en-US' : 'zh-HK'; }
  u.rate = 0.95;
  u.onend = u.onerror = () => stopRead();
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  reading = true;
  const b = document.getElementById('readBtn');
  if (b) b.textContent = '⏹ 停';
}
// 暖一暖 voices（有啲機第一次係空嘅）
try { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } } catch (e) {}

// ============ Tabs ============
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.tab).classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});
function goTab(name) {
  stopRead();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  activeTab = name; render();
}

// ============ Library ============
function renderLibrary() {
  const el = document.getElementById('page-library');
  if (!state.stories.length) {
    el.innerHTML = '<div class="empty">仲未有故事<br>撳下面開你第一個故事啦！</div><button class="big-btn" onclick="newStory()">＋ 開新故事</button>'
      + `<div class="backup-row">
        <button class="backup-btn" onclick="document.getElementById('importFileEmpty').click()">📤 還原備份</button>
        <input type="file" id="importFileEmpty" accept=".json,application/json" style="display:none" onchange="importData(this)">
      </div>`;
    return;
  }
  let html = '<div class="story-grid">';
  state.stories.forEach((s, i) => {
    const ch = s.chapters.length;
    html += `<div class="story-card" onclick="openStory('${s.id}')">
      <div class="story-cover" style="background:${COVERS[i % COVERS.length]}">${coverHTML(s, i)}</div>
      <div class="info">
      <div class="title">${esc(s.title)}</div><div class="meta">${ch} 章 · ${fmtDate(s.updatedAt)}更新</div>
      <div class="card-actions" id="ca-${s.id}">
        <button class="card-btn" onclick="event.stopPropagation();pickCover('${s.id}')">🎨 轉封面</button>
        <button class="card-btn icon-only" onclick="event.stopPropagation();askDelStory('${s.id}')" title="刪除">🗑</button>
      </div></div></div>`;
  });
  html += '</div><button class="big-btn" onclick="newStory()">＋ 開新故事</button>';
  html += `<div class="backup-row">
    <button class="backup-btn" onclick="exportData()">📥 備份</button>
    <button class="backup-btn" onclick="document.getElementById('importFile').click()">📤 還原</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
  </div>
  <div class="backup-note">備份會將所有故事下載成一個檔案<br>轉機或者清 browser 資料之前記得備份<br>已用 ${storageMB()} MB（上限約 5MB）</div>
  <div class="backup-row" style="margin-top:10px">
    <button class="backup-btn" onclick="checkUpdate()">🔄 檢查更新</button>
  </div>
  <div class="backup-note" id="updateNote"></div>`;
  el.innerHTML = html;
}
// 備份：成個 state 下載做 JSON（export 前先將舊 remote 圖轉做 dataURL，確保齊圖）
async function exportData() {
  const btns = document.querySelectorAll('.backup-btn');
  btns.forEach(b => { b.disabled = true; });
  try {
    const jobs = [];
    for (const story of state.stories) {
      for (const im of story.illustrations || []) {
        if (im.url && im.url.startsWith('http')) {
          jobs.push(
            fetch(im.url).then(r => { if (!r.ok) throw 0; return r.blob(); }).then(blob => new Promise(res => {
              const fr = new FileReader();
              fr.onload = e => { im.url = e.target.result; res(); };
              fr.onerror = () => res();
              fr.readAsDataURL(blob);
            })).catch(() => {})
          );
        }
      }
    }
    if (jobs.length) {
      await Promise.all(jobs);
      try { save(); } catch (e) { alert('圖太多，localStorage 爆咗，部分舊圖轉唔到'); }
      render();
    }
  } finally {
    btns.forEach(b => { b.disabled = false; });
  }
  const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `故事工作室-備份-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
// 還原：讀 JSON 檔，驗證後覆寫
function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.stories)) throw new Error('bad');
      for (const s of data.stories) {
        if (!s.id || !Array.isArray(s.chapters)) throw new Error('bad');
      }
      if (!confirm(`搵到 ${data.stories.length} 個故事。還原會覆寫而家全部內容，肯定？`)) { input.value = ''; return; }
      state = data;
      if (!getStory() && state.stories.length) state.activeStory = state.stories[0].id;
      save(); render();
      alert('還原完成！');
    } catch (err) { alert('呢個唔係有效嘅備份檔'); }
    input.value = '';
  };
  reader.readAsText(file);
}
function newStory() {
  const s = { id: uid(), title: '未命名故事', cover: COVER_EMOJI[state.stories.length % 6], chapters: [{ id: uid(), title: '第一章', content: '' }], characters: [], illustrations: [], updatedAt: Date.now() };
  state.stories.unshift(s); state.activeStory = s.id; state.activeChapter = s.chapters[0].id;
  save(); goTab('write');
}
function openStory(id) { state.activeStory = id; const s = getStory(); state.activeChapter = s.chapters[0] ? s.chapters[0].id : null; save(); goTab('write'); }
function delStory(id) {
  state.stories = state.stories.filter(x => x.id !== id);
  if (state.activeStory === id) state.activeStory = null;
  save(); render();
}
// 刪除兩步：撳 🗑 → 出「取消 / 長㩒10秒刪除」
function askDelStory(id) {
  renderLibrary(); // 先還原晒其他卡
  const row = document.getElementById('ca-' + id);
  if (!row) return;
  row.innerHTML =
    `<button class="card-btn" onclick="event.stopPropagation();renderLibrary()">取消</button>` +
    `<button class="card-btn danger" onclick="event.stopPropagation()" onpointerdown="pressDelStart('${id}',this,event)" onpointerup="pressDelEnd()" onpointercancel="pressDelEnd()" onpointerleave="pressDelEnd()" oncontextmenu="return false">🗑 長㩒10秒刪除</button>`;
}
// 長㩒刪除：㩒住唔放先刪，掂一下唔會有事
let pressTimer = null, pressTarget = null;
const PRESS_MS = 10000;
function pressDelStart(id, btn, ev) {
  if (ev.cancelable) ev.preventDefault();
  try { btn.setPointerCapture(ev.pointerId); } catch (e) {}
  pressDelEnd();
  pressTarget = btn;
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.classList.add('pressing');
  btn.style.setProperty('--p', '0%');
  const t0 = Date.now();
  pressTimer = setInterval(() => {
    const remain = PRESS_MS - (Date.now() - t0);
    const p = Math.min(1, 1 - remain / PRESS_MS);
    btn.style.setProperty('--p', (p * 100).toFixed(0) + '%');
    btn.textContent = '🗑 仲有 ' + Math.max(1, Math.ceil(remain / 1000)) + ' 秒';
    if (remain <= 0) { pressDelEnd(); delStory(id); }
  }, 100);
}
function pressDelEnd() {
  if (pressTimer) { clearInterval(pressTimer); pressTimer = null; }
  if (pressTarget) {
    pressTarget.classList.remove('pressing');
    pressTarget.style.setProperty('--p', '0%');
    if (pressTarget.dataset.label) pressTarget.textContent = pressTarget.dataset.label;
    pressTarget = null;
  }
}
function touchStory() { const s = getStory(); if (s) { s.updatedAt = Date.now(); save(); } }

// ============ Write ============
let saveTimer = null;
function renderWrite() {
  const el = document.getElementById('page-write');
  const s = getStory();
  if (!s) { el.innerHTML = '<div class="empty">去故事架揀個故事<br>或者開個新嘅先</div>'; return; }
  const ch = s.chapters.find(c => c.id === state.activeChapter) || s.chapters[0];
  let chips = s.chapters.map(c =>
    `<button class="chap-chip ${c.id === (ch && ch.id) ? 'active' : ''}" onclick="switchChap('${c.id}')">${esc(c.title)}</button>`).join('');
  chips += `<button class="chap-chip add" onclick="addChap()">＋</button>`;
  el.innerHTML = `
    <button class="back-btn" onclick="goTab('library')">‹ 返故事架</button>
    <input class="story-title-input" value="${esc(s.title)}" oninput="renameStory(this.value)" placeholder="故事名">
    <div class="chap-bar">${chips}</div>
    ${ch ? `<div class="chap-title-row">
      <input value="${esc(ch.title)}" oninput="renameChap('${ch.id}',this.value)" placeholder="章節名">
      <button class="icon-btn" id="readBtn" onclick="toggleRead()">🔊 朗讀</button>
      <button class="icon-btn" onclick="delChap('${ch.id}')">刪</button>
    </div>
    <textarea class="write-area" oninput="editChap('${ch.id}',this.value)" placeholder="喺呢度寫低你個故事…">${esc(ch.content)}</textarea>
    <div class="save-hint" id="saveHint">自動儲存 ✓</div>` : ''}
    <div class="spark-wrap">
      <button class="spark-btn" onclick="showSparks()">💡 冇靈感？撳我</button>
      <div class="spark-results" id="sparkResults"></div>
      <div class="spark-note">唔撳就乜都唔會發生 · 用唔用都係你話事</div>
    </div>`;
}
function renameStory(v) { const s = getStory(); s.title = v; touchStory(); }
function switchChap(id) { stopRead(); state.activeChapter = id; save(); renderWrite(); }
function addChap() { const s = getStory(); const c = { id: uid(), title: '第' + (s.chapters.length+1) + '章', content: '' }; s.chapters.push(c); state.activeChapter = c.id; touchStory(); renderWrite(); }
function renameChap(id, v) { const s = getStory(); const c = s.chapters.find(x => x.id === id); c.title = v; touchStory(); }
function delChap(id) { const s = getStory(); if (s.chapters.length <= 1) { alert('至少要留返一章'); return; } if (!confirm('刪咗呢章？')) return; s.chapters = s.chapters.filter(c => c.id !== id); state.activeChapter = s.chapters[0].id; touchStory(); renderWrite(); }
function editChap(id, v) {
  const s = getStory(); const c = s.chapters.find(x => x.id === id); c.content = v; touchStory();
  clearTimeout(saveTimer);
  const hint = document.getElementById('saveHint'); if (hint) hint.textContent = '打緊字…';
  saveTimer = setTimeout(() => { const h = document.getElementById('saveHint'); if (h) h.textContent = '自動儲存 ✓'; }, 800);
}
async function showSparks() {
  const box = document.getElementById('sparkResults');
  box.innerHTML = '<div class="spark-item" style="color:#888">AI 諗緊…等幾秒</div>';
  box.classList.add('show');
  const s = getStory();
  let r = await fetchAISparks(s);
  // fetch 失敗（timeout/網絡/429）自動重試一次；離題唔重試
  if (!r.sparks.length && (r.reason === 'timeout' || r.reason === 'network' || r.reason === 'http429')) {
    await new Promise(res => setTimeout(res, 3000));
    r = await fetchAISparks(s);
  }
  // 相關度檢查：AI 成日唔理 context 作啲無關嘢 — 冇一個靈感掂到故事關鍵字就當佢失敗
  const kws = sparkKeywords(s);
  const ok = r.sparks.length >= 1 && sparksRelevant(r.sparks, kws);
  if (ok) {
    box.innerHTML = r.sparks.map(p => `<div class="spark-item">${esc(p)}</div>`).join('');
  } else {
    const why = !r.sparks.length
      ? (r.reason === 'timeout' ? '等太耐' : r.reason === 'network' ? '網絡問題' : r.reason === 'http429' ? '太多人用' : '出唔到嘢')
      : '答得唔啱題';
    box.innerHTML = `<div class="spark-item" style="color:#888">AI 忙緊（${why})，遲啲再撳過</div>`;
  }
}
// 故事關鍵字：標題、人物名、近排寫嘅字 — 用嚟驗 AI 有冇離題
function sparkKeywords(s) {
  if (!s) return [];
  const kws = [];
  if (s.title && s.title !== '未命名故事')
    s.title.split(/[\s《》「」『』，、。！？!?,.;:：；]+/).filter(w => w.length >= 2).forEach(w => kws.push(w));
  s.characters.forEach(c => { if (c.name && c.name.trim()) kws.push(c.name.trim()); });
  const ch = s.chapters.find(c => c.id === state.activeChapter);
  if (ch && ch.content)
    ch.content.split(/\s+/).map(w => w.replace(/[^A-Za-z]/g, '')).filter(w => w.length >= 4).slice(-12).forEach(w => kws.push(w));
  return [...new Set(kws.map(k => k.toLowerCase()))];
}
function sparksRelevant(sparks, kws) {
  if (!kws.length) return true;
  return sparks.some(sp => { const l = sp.toLowerCase(); return kws.some(k => k && l.includes(k)); });
}
// 將 AI 回嚟嘅文字拆做靈感：每行一個，太長就斷句，最多 3 個
function parseSparks(text) {
  const lines = text.split('\n').map(l => l.replace(/^[\d\.\、\:\-\*\s#>「"]+/, '').trim()).filter(l => l.length > 8);
  const out = [];
  for (const line of lines) {
    if (out.length >= 3) break;
    if (line.length <= 260) { out.push(line); continue; }
    // 太長：斷句，拎頭兩句
    const sens = line.split(/(?<=[。！？.!?])\s*/).filter(x => x.trim().length > 8);
    let sp = sens.slice(0, 2).join(' ');
    if (sp.length > 260) sp = sp.slice(0, 257) + '…';
    if (sp) out.push(sp);
  }
  return out;
}
// 真 AI：將故事 context 送去 LLM，即場諗靈感
async function fetchAISparks(s) {
  try {
    const names = s ? s.characters.map(c => c.name + (c.desc ? '（' + c.desc.slice(0, 30) + '）' : '')).join('；') : '';
    const ch = s ? s.chapters.find(c => c.id === state.activeChapter) : null;
    const excerpt = ch && ch.content ? ch.content.slice(-500) : '';
    const sample = [s && s.title, excerpt].filter(Boolean).join(' ');
    const isEN = sample && (sample.replace(/[^A-Za-z]/g, '').length > sample.replace(/[^一-鿿]/g, '').length * 2);
    const lang = isEN ? '用英文回覆' : '只用繁體中文回覆';
    const parts = ['你係幫12歲小朋友寫故事嘅靈感助手，' + lang + '。'];
    if (s && s.title && s.title !== '未命名故事') parts.push('故事名：《' + s.title + '》');
    if (names) parts.push('人物：' + names);
    if (ch) parts.push('寫緊：' + ch.title);
    if (excerpt) parts.push('近排寫咗：' + excerpt);
    parts.push('畀3個簡短故事靈感，每個一至兩句，只係方向唔好寫成段故仔。每行一個，唔加編號，唔加解釋。');
    parts.push('重要：每一個靈感都要直接用到上面嘅故事名、人物名或者已寫內容，唔准作新嘅無關人物、地方或者世界觀（例如唔好突然寫沙漠/森林/水晶呢啲同故事無關嘅嘢）。資料唔夠就問一條關於主角嘅問題。');
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 25000);
    const res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(parts.join('\n')), { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) return { sparks: [], reason: res.status === 429 ? 'http429' : 'http' + res.status };
    const text = await res.text();
    const sparks = parseSparks(text);
    if (!sparks.length) return { sparks: [], reason: 'parse' };
    return { sparks, reason: '' };
  } catch (e) { return { sparks: [], reason: e && e.name === 'AbortError' ? 'timeout' : 'network' }; }
}
// 根據已寫嘅內容（人物名、故事名、章節）砌返相關嘅靈感
// ============ Characters ============
function storyPickerHTML() {
  const s = getStory();
  if (!s) return '';
  const opts = state.stories.map(x => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('');
  return `<div class="story-picker"><select onchange="state.activeStory=this.value;save();render();">${opts}</select></div>`;
}
function renderChars() {
  const el = document.getElementById('page-chars');
  const s = getStory();
  if (!s) { el.innerHTML = '<div class="empty">去故事架揀個故事先</div>'; return; }
  let html = storyPickerHTML();
  html += `<div class="char-form">
    <div class="photo-row">
      <div class="photo-preview" id="photoPreview">＋</div>
      <button class="photo-btn" onclick="document.getElementById('ncPhoto').click()">上載相片</button>
      <input type="file" id="ncPhoto" accept="image/*" style="display:none" onchange="previewPhoto(this)">
    </div>
    <input id="ncName" placeholder="人物名，例如：赤甲獸">
    <textarea id="ncDesc" placeholder="佢係點嘅人？例如：主角嘅拍檔，怕黑，鍾意食石頭"></textarea>
    <button onclick="addChar()">加入人物卡</button></div><div class="char-grid">`;
  s.characters.forEach((c, i) => {
    const avatar = c.photo
      ? `<div class="char-avatar"><img src="${c.photo}" alt=""></div>`
      : `<div class="char-avatar" style="background:${AVATAR_BG[i % AVATAR_BG.length]}">${AVATAR_EMOJI[i % AVATAR_EMOJI.length]}</div>`;
    html += `<div class="char-card"><span class="x" onclick="delChar('${c.id}')">×</span>
      ${avatar}
      <div class="name">${esc(c.name)}</div><div class="desc">${esc(c.desc).replace(/\n/g,'<br>')}</div>
      <div style="margin-top:8px"><button class="photo-btn" style="padding:6px 16px;font-size:12px" onclick="editChar('${c.id}')">改</button></div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
  // 如果啱啱撳咗改，填返個 form
  if (editingChar) {
    const s2 = getStory(); const c = s2.characters.find(x => x.id === editingChar);
    if (c) {
      document.getElementById('ncName').value = c.name;
      document.getElementById('ncDesc').value = c.desc || '';
      if (c.photo) { pendingPhoto = c.photo; document.getElementById('photoPreview').innerHTML = `<img src="${c.photo}">`; }
      const btns = document.querySelectorAll('.char-form button');
      btns[btns.length - 1].textContent = '儲存修改';
      btns[btns.length - 1].setAttribute('onclick', 'saveCharEdit()');
    }
  }
}
let editingChar = null;
let pendingPhoto = null;
function previewPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // 壓縮到 300px，慳 localStorage 位
      const max = 300;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      pendingPhoto = cv.toDataURL('image/jpeg', 0.7);
      document.getElementById('photoPreview').innerHTML = `<img src="${pendingPhoto}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function addChar() {
  const s = getStory(); if (!s) return;
  const name = document.getElementById('ncName').value.trim();
  const desc = document.getElementById('ncDesc').value.trim();
  if (!name) { alert('畀個人物名先'); return; }
  s.characters.push({ id: uid(), name, desc, photo: pendingPhoto });
  pendingPhoto = null; touchStory(); renderChars();
}
function editChar(id) { editingChar = id; pendingPhoto = null; renderChars(); window.scrollTo(0, 0); }
function saveCharEdit() {
  const s = getStory(); if (!s || !editingChar) return;
  const c = s.characters.find(x => x.id === editingChar); if (!c) return;
  const name = document.getElementById('ncName').value.trim();
  if (!name) { alert('畀個人物名先'); return; }
  c.name = name;
  c.desc = document.getElementById('ncDesc').value.trim();
  if (pendingPhoto) c.photo = pendingPhoto;
  editingChar = null; pendingPhoto = null; touchStory(); renderChars();
}
function delChar(id) {
  const s = getStory(); const c = s.characters.find(x => x.id === id);
  if (!confirm(`真係刪咗「${c ? c.name : ''}」呢張人物卡？`)) return;
  s.characters = s.characters.filter(x => x.id !== id); touchStory(); renderChars();
}


// ============ Render ============
function render() {
  if (activeTab === 'library') renderLibrary();
  else if (activeTab === 'write') renderWrite();
  else if (activeTab === 'chars') renderChars();
}
render();

// ============ PWA: service worker ============
async function checkUpdate() {
  const note = document.getElementById('updateNote');
  const say = t => { if (note) note.textContent = t; };
  try {
    if (!('serviceWorker' in navigator)) { say('呢個瀏覽器唔支援'); return; }
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { say('未啟用離線模式，開返網再試'); return; }
    say('檢查緊…');
    await reg.update(); // 掠過 cache，直接問 GitHub 攞最新版
    let done = false;
    const go = () => { if (!done) { done = true; location.reload(); } };
    navigator.serviceWorker.addEventListener('controllerchange', go);
    setTimeout(go, 2500); // 保底：點都有 reload
  } catch (e) { say('檢查失敗，遲啲再試'); }
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
